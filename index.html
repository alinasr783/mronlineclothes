<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maison Royale — Luxury Hoodies</title>
  <meta name="description" content="Maison Royale — heavyweight luxury hoodies with hand-finished embroidery. Crafted in Egypt. Cash on delivery nationwide.">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maison Royale">
  <meta property="og:title" content="Maison Royale — Wear the Crown">
  <meta property="og:description" content="Heavyweight luxury hoodies, embroidered by hand. Crafted in Egypt.">
  <meta property="og:image" content="assets/img/og.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/img/icon-192.png">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=El+Messiri:wght@400;500;600&family=Manrope:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

  <!-- Preloader -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <div class="preloader__mark">
        <img src="assets/img/mr-mark.png" alt="">
        <span class="preloader__shine"></span>
      </div>
      <div class="preloader__word"><img src="assets/img/wordmark.png" alt=""></div>
      <div class="preloader__line"><span></span><i class="star"></i><span></span></div>
      <div class="preloader__count"><span id="loadCount">0</span></div>
    </div>
    <div class="preloader__panel preloader__panel--top"></div>
    <div class="preloader__panel preloader__panel--bottom"></div>
  </div>

  <!-- Route transition curtain -->
  <div class="curtain" id="curtain" aria-hidden="true">
    <img src="assets/img/mr-mark.png" alt="">
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__label" id="cursorLabel"></span></div>
  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

  <!-- Announcement bar -->
  <div class="announce" id="announce">
    <div class="announce__track" id="announceTrack"></div>
  </div>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header__inner">
      <button class="icon-btn header__menu" id="menuBtn" aria-label="Menu">
        <span class="burger"><i></i><i></i></span>
      </button>
      <nav class="header__nav">
        <a href="#/shop" data-link data-i18n="nav.shop">Shop</a>
        <a href="#/shop/signature" data-link data-i18n="nav.collections">Collections</a>
        <a href="#/maison" data-link data-i18n="nav.about">Maison</a>
      </nav>
      <a href="#/" class="header__logo" data-link aria-label="Maison Royale — Home">
        <img src="assets/img/mr-mark.png" alt="Maison Royale">
      </a>
      <div class="header__actions">
        <button class="lang-btn" id="langBtn" data-i18n="lang">العربية</button>
        <button class="icon-btn" id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <a href="#/wishlist" class="icon-btn hide-sm" data-link aria-label="Wishlist">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.1C4.5 7 6.6 5 9 5c1.4 0 2.4.6 3 1.6C12.6 5.6 13.6 5 15 5c2.4 0 4.5 2 4.5 4.9C19.5 15.4 12 20 12 20z"/></svg>
          <span class="badge-dot" id="wishCount"></span>
        </a>
        <button class="icon-btn bag-btn" id="bagBtn" aria-label="Bag">
          <svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
          <span class="bag-count" id="bagCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Fullscreen menu -->
  <div class="menu" id="menu" aria-hidden="true">
    <div class="menu__bg"></div>
    <nav class="menu__nav">
      <a href="#/" data-link><span class="menu__num">01</span><span data-i18n="nav.home">Home</span></a>
      <a href="#/shop" data-link><span class="menu__num">02</span><span data-i18n="nav.shop">Shop</span></a>
      <a href="#/shop/essentials" data-link><span class="menu__num">03</span><span data-i18n="cat.essentials">Essentials</span></a>
      <a href="#/shop/signature" data-link><span class="menu__num">04</span><span data-i18n="cat.signature">Signature</span></a>
      <a href="#/shop/limited" data-link><span class="menu__num">05</span><span data-i18n="cat.limited">Limited</span></a>
      <a href="#/maison" data-link><span class="menu__num">06</span><span data-i18n="nav.about">Maison</span></a>
      <a href="#/wishlist" data-link><span class="menu__num">07</span><span data-i18n="nav.wishlist">Wishlist</span></a>
    </nav>
    <div class="menu__foot">
      <img src="assets/img/wordmark.png" alt="" class="menu__word">
      <div class="menu__social" id="menuSocial"></div>
    </div>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <!-- Mobile tab bar -->
  <nav class="tabbar" id="tabbar">
    <a href="#/" data-link data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="#/shop" data-link data-tab="shop">
      <svg viewBox="0 0 24 24"><path d="M8.5 4L4 6.5l1.8 4L8 9.6V20h8V9.6l2.2.9 1.8-4L15.5 4c-.6 1.6-2 2.5-3.5 2.5S9.1 5.6 8.5 4z"/></svg>
      <span data-i18n="nav.shop">Shop</span>
    </a>
    <button data-tab="search" id="tabSearch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span data-i18n="nav.search">Search</span>
    </button>
    <a href="#/wishlist" data-link data-tab="wishlist">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.1C4.5 7 6.6 5 9 5c1.4 0 2.4.6 3 1.6C12.6 5.6 13.6 5 15 5c2.4 0 4.5 2 4.5 4.9C19.5 15.4 12 20 12 20z"/></svg>
      <span data-i18n="nav.wishlist">Wishlist</span>
    </a>
    <button data-tab="bag" id="tabBag">
      <svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
      <span data-i18n="nav.bag">Bag</span>
      <em class="tab-count" id="tabCount">0</em>
    </button>
    <span class="tabbar__glow" id="tabGlow"></span>
  </nav>

  <!-- Cart drawer / bottom sheet -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Bag">
    <div class="drawer__grip" id="drawerGrip"><span></span></div>
    <div class="drawer__head">
      <h3><span data-i18n="cart.title">Your Bag</span> <sup id="drawerCount">0</sup></h3>
      <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer__free" id="freeBar"><p id="freeText"></p><div class="progress"><span id="freeProgress"></span></div></div>
    <div class="drawer__body" id="drawerBody"></div>
    <div class="drawer__foot" id="drawerFoot"></div>
  </aside>

  <!-- Search overlay -->
  <div class="search" id="search" aria-hidden="true">
    <div class="search__bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="searchInput" type="search" autocomplete="off" data-i18n-ph="search.ph" placeholder="Search…">
      <button class="icon-btn" data-close-search aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="search__tags" id="searchTags"></div>
    <div class="search__results" id="searchResults"></div>
  </div>

  <!-- Size guide sheet -->
  <div class="sheet" id="sizeSheet" aria-hidden="true">
    <div class="sheet__panel">
      <div class="drawer__grip"><span></span></div>
      <div class="drawer__head">
        <h3 data-i18n="size.title">Size Guide</h3>
        <button class="icon-btn" data-close-sheet aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet__body" id="sizeBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/products.js"></script>
  <script src="js/hoodie.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
